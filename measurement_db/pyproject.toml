[tool.poetry]
name = "measurement-db"
version = "0.1.0"
description = "Definition and utilities for the UT3 Measurement database"
authors = ["Reinier van Mourik <reinier.vanmourik@tausystems.com>"]
readme = "README.md"
packages = [{include = "measurement_db"}]

[tool.poetry.dependencies]
python = "^3.9"
sqlalchemy = "^2.0.25"
python-dotenv = "^1.0.1"
psycopg2-binary = "^2.9.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
